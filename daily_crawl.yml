name: KNU Contest Daily Crawler

on:
  schedule:
    # 매일 오전 09:00 KST (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 언제든 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 크롤러 패키지 설치
        run: pip install -r requirements.txt

      - name: 경북대 8개 기관 게시판 크롤링 실행
        run: python knu_crawler.py --output data/competitions.json

      - name: 변경된 공모전 데이터 자동 커밋 및 푸시 (웹사이트 자동 업데이트)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/competitions.json
          git diff --staged --quiet || git commit -m "chore(data): 일일 경북대 공모전 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
